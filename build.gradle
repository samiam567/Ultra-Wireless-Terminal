plugins {
    id 'net.neoforged.moddev' version '1.0.17'
}
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.251'
    runs {
        client { client() }
        server { server() }
    }
    mods {
        ultra_wireless_terminal_2 {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    // Proxies Maven Central too, so JUnit resolves without adding mavenCentral().
    maven { url = 'https://maven.neoforged.net/releases' }
    // Create (optional compileOnly soft dependency): mod gates calls behind Class.forName
    // at runtime so it runs fine without Create installed.
    maven { url = 'https://api.modrinth.com/v2/maven2' }
}

dependencies {
    compileOnly fileTree(dir: 'libs', include: '*.jar')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
    testCompileOnly fileTree(dir: 'libs', include: '*.jar')
    testRuntimeOnly fileTree(dir: 'libs', include: '*.jar')
    testCompileOnly fileTree(dir: 'build/moddev/artifacts', include: '*.jar')
    testRuntimeOnly fileTree(dir: 'build/moddev/artifacts', include: '*.jar')
    def gradleCache = new File(gradle.gradleUserHomeDir, 'caches/modules-2')
    testCompileOnly fileTree(dir: gradleCache, include: '**/*.jar')
    testRuntimeOnly fileTree(dir: gradleCache, include: '**/*.jar')
}

processResources {
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(version: '1.0.0', mcversion: '1.21.1')
    }
}

// Force a source/compile encoding so non-ASCII glyphs (e.g. GUI arrow buttons) don't
// depend on the host JVM's platform-default charset.
compileJava.options.encoding = 'UTF-8'
compileTestJava.options.encoding = 'UTF-8'

test { useJUnitPlatform() }
